[project]
name = "face-recognition-attendance"
version = "1.0.0"
description = "AI-Based Face Recognition Attendance System using YuNet + SFace"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.0",
    "opencv-contrib-python==4.13.0.92",
]

[dependency-groups]
test = ["pytest>=8.0"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
